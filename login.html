<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevate | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="app login-app">

        <div class="login-hero">
            <img src="assets/aviao.png" alt="" class="login-hero-image">
            <div class="login-hero-overlay"></div>
            <img src="assets/logo2.png" alt="Elevate" class="login-hero-logo">
        </div>

        <div class="login-card">

            <h1 class="login-title">Login</h1>

            <form class="login-form">

                <div class="input-field">
                    <span class="material-symbols-rounded">mail</span>
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="input-field">
                    <span class="material-symbols-rounded">lock</span>
                    <input type="password" placeholder="Senha" required>
                    <button type="button" class="toggle-password">
                        <span class="material-symbols-rounded">visibility_off</span>
                    </button>
                </div>

                <a href="#" class="forgot-password">Esqueci minha senha</a>

            </form>

            <a href="index.html" class="login-button">Entrar</a>

            <div class="divider">
                <span>OU</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="social-button">
                    Continuar com o Google
                </button>

                <button type="button" class="social-button">
                    Continuar com a Apple
                </button>
            </div>

        </div>

    </div>

</body>
</html>
